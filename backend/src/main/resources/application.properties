spring.application.name=backend
spring.sql.init.schema-locations=classpath:opengeodb_schema.sql,classpath:schema.sql
spring.sql.init.data-locations=classpath:opengeodb_de_data.sql,classpath:data.sql
# Hibernate prüft, ob die Relationsschemas zu den Entities passt
spring.jpa.hibernate.ddl-auto=validate
# Maximale Größe der gesamten Request: ~ 50.1MB
spring.servlet.multipart.max-request-size=51303KB
# Maximale Größe einer einzelnen Datei
spring.servlet.multipart.max-file-size=60MB
# secure=false ist hier nur für lokale Entwicklung mit HTTP gedacht. In Produktion muss HTTPS verwendet und secure=true gesetzt werden.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

#logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=DEBUG
#logging.level.org.springframework.web=DEBUG
