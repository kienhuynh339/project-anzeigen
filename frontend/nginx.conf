# Den virtuellen Server (Virtual Host) definieren
server {
    # nginx lauscht auf Port 80
    listen 80;

    # Servernamen (Hostnamen) festlegen
    server_name localhost;

    # React-Anwendung
    location / {
        # Das Stammverzeichnis, aus dem nginx statische Dateien ausliefert, festlegen
        root /usr/share/nginx/html;
        # festlegen, welche Datei nginx standardmäßig ausliefert, wenn ein Verzeichnis angefragt wird
        index index.html;

        # Fallback (index.html) für nicht existierende Dateien/Verzeichnisse festlegen
        # Beispiel: "/meine-anzeigen"-Datei/Verzeichnis existiert nicht -> index.html ausliefern, dann übernimmt React Router und erkennt den Pfad "/meine-anzeigen" und die "/meine-anzeigen"-Seite wird gerendert
        try_files $uri $uri/ /index.html;
    }

    # Spring Boot REST API
    location /api/ {
        # nginx leite die empfangene "/api/..."-Anfrage  an den Server backend auf Port 8080 weiter
        # "backend" ist der Name eines Docker-Compose-Services (in compose.yaml)
        proxy_pass http://backend:8080;

        # HTTP/1.1 für die Verbindung zum Backend verwenden
        proxy_http_version 1.1;

        # Den HTTP-Header Host, den nginx an Spring Boot weiterleitet, setzen
        # $host ist eine nginx-Variable und enthält den Hostnamen der Anfrage
        proxy_set_header Host $host;
        # Die IP-Adresse des Clients
        # $remote_addr enthält die IP-Adresse des direkten Verbindungspartners. Wenn der Browser direkt mit nginx kommuniziert, ist das normalerweise die Client-IP
        proxy_set_header X-Real-IP $remote_addr;
        # Der Header "X-Forwarded-For" verfolgt die IP-Adressen entlang einer Proxy-Kette
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # "X-Forwarded-Proto": welches Protokoll der Client ursprünglich verwendet hat
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Spring Boot WebSocket
    location /ws {
        proxy_pass http://backend:8080/ws;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;

        # wie lange nginx maximal auf Daten vom Backend warten darf
        proxy_read_timeout 3600s;
        # Das Timeout beim Senden von Daten von Nginx an das Backend
        proxy_send_timeout 3600s;

        # Response-Buffering von Nginx deaktivieren
        # Normalerweise kann Nginx Daten vom Backend zunächst zwischenspeichern, bevor sie an den Client weitergegeben werden
        # WebSockets werden für eine bidirektionale Kommunikation verwendet. Man möchte, dass Nachrichten möglichst unmittelbar weitergeleitet werden.
        proxy_buffering off;
    }
}
